services:
  db:
    image: postgres:16
    container_name: casproject_db
    env_file:
      - /srv/secrets/casproject/db.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema of record, applied only when the data directory is empty. The live
      # volume is already populated, so this is inert here and exists so a fresh
      # environment has a defined starting schema - previously it had none, and
      # ddl-auto: update was the only thing that ever created these tables.
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - casprojectnet
    restart: unless-stopped
    healthcheck:
      # POSTGRES_USER and POSTGRES_DB come from /srv/secrets/casproject/db.env.
      test: ["CMD-SHELL", "pg_isready -q -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: casproject_backend
    depends_on:
      db:
        # service_healthy, not the default service_started: a started postgres
        # is not an accepting postgres, so the backend used to race the
        # database on every deploy and rely on restart to recover.
        condition: service_healthy
    env_file:
      - /srv/secrets/casproject/db.env
      - /srv/secrets/casproject/jwt.env
      - /srv/secrets/casproject/mail.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/casproject
      SERVER_PORT: 8080
    volumes:
      - uploads:/app/uploads
    networks:
      - casprojectnet
      - proxy-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Pin the network Traefik routes over. Containers attached to more than one
      # network leave the choice non-deterministic, and Traefik can pick the internal one.
      - "traefik.docker.network=proxy-network"

      # Backend is served at https://casproject.santoriello.ch/api
      - "traefik.http.routers.casproject-backend.rule=Host(`casproject.santoriello.ch`) && PathPrefix(`/api`)"
      - "traefik.http.routers.casproject-backend.entrypoints=websecure"
      - "traefik.http.routers.casproject-backend.tls.certresolver=le"
      - "traefik.http.routers.casproject-backend.service=casproject-backend"
      - "traefik.http.routers.casproject-backend.priority=100"
      # Springboot listens on port 8080
      - "traefik.http.services.casproject-backend.loadbalancer.server.port=8080"
      # security-headers and gzip-compress live in Traefik's file provider.
      - "traefik.http.routers.casproject-backend.middlewares=security-headers@file,gzip-compress@file"
    healthcheck:
      # bash explicitly: /dev/tcp is a bash builtin and this image's /bin/sh is
      # dash. No actuator dependency exists, so a TCP connect is the available
      # readiness signal - Tomcat binds 8080 only after the context loads.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: casproject_frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - proxy-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Pin the network Traefik routes over. Containers attached to more than one
      # network leave the choice non-deterministic, and Traefik can pick the internal one.
      - "traefik.docker.network=proxy-network"
      - "traefik.http.routers.casproject-frontend.rule=Host(`casproject.santoriello.ch`)"
      - "traefik.http.routers.casproject-frontend.entrypoints=websecure"
      - "traefik.http.routers.casproject-frontend.tls.certresolver=le"
      - "traefik.http.services.casproject-frontend.loadbalancer.server.port=8080"
      - "traefik.http.routers.casproject-frontend.middlewares=security-headers@file,gzip-compress@file"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
  uploads:

networks:
  casprojectnet:
  proxy-network:
    external: true
