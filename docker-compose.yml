services:
  db:
    image: postgres:16
    container_name: casproject_db
    env_file:
      - /srv/secrets/casproject/db.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - casprojectnet
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: casproject_backend
    depends_on:
      - db
    env_file:
      - /srv/secrets/casproject/db.env
      - /srv/secrets/casproject/jwt.env
      - /srv/secrets/casproject/mail.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/casproject
      SERVER_PORT: 8080
    networks:
      - casprojectnet
      - proxy-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Pin the network Traefik routes over. Containers attached to more than one
      # network leave the choice non-deterministic, and Traefik can pick the internal one.
      - "traefik.docker.network=proxy-network"

      # Backend is served at https://casproject.santoriello.ch/api
      - "traefik.http.routers.casproject-backend.rule=Host(`casproject.santoriello.ch`) && PathPrefix(`/api`)"
      - "traefik.http.routers.casproject-backend.entrypoints=websecure"
      - "traefik.http.routers.casproject-backend.tls.certresolver=le"
      - "traefik.http.routers.casproject-backend.service=casproject-backend"
      - "traefik.http.routers.casproject-backend.priority=100"
      # Springboot listens on port 8080
      - "traefik.http.services.casproject-backend.loadbalancer.server.port=8080"
      # security-headers and gzip-compress live in Traefik's file provider.
      - "traefik.http.routers.casproject-backend.middlewares=security-headers@file,gzip-compress@file"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: casproject_frontend
    depends_on:
      - backend
    networks:
      - proxy-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Pin the network Traefik routes over. Containers attached to more than one
      # network leave the choice non-deterministic, and Traefik can pick the internal one.
      - "traefik.docker.network=proxy-network"
      - "traefik.http.routers.casproject-frontend.rule=Host(`casproject.santoriello.ch`)"
      - "traefik.http.routers.casproject-frontend.entrypoints=websecure"
      - "traefik.http.routers.casproject-frontend.tls.certresolver=le"
      - "traefik.http.services.casproject-frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.casproject-frontend.middlewares=security-headers@file,gzip-compress@file"

volumes:
  pgdata:

networks:
  casprojectnet:
  proxy-network:
    external: true
