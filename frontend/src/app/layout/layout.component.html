<div class="min-h-screen overflow-hidden bg-slate-50 flex flex-col">
  <!-- ===================== -->
  <!-- Topbar / Header -->
  <!-- ===================== -->
  <header class="fixed top-0 left-0 right-0 z-30 h-16 bg-white border-b border-slate-200">
    <div class="mx-auto px-6 h-full flex items-center justify-between gap-4">

      <!-- Left section: logo, mobile menu toggle, user display name, connection status -->
      <div class="flex items-center gap-3.5 min-w-0">
        <!-- Logo link to the welcome/start page -->
        <a class="inline-flex items-center gap-2.5 no-underline" routerLink="/welcome" aria-label="Zur Startseite">
          <span class="shadow-sm flex items-center">
            <img class="h-14 w-[160px] object-contain block" src="/assets/logo.png" alt="ReTrainEd" />
          </span>
        </a>

        <!-- Mobile-only sidebar toggle button -->
        <button class="md:hidden border border-slate-200 bg-white rounded-xl p-2 cursor-pointer hover:shadow-sm" (click)="toggleSidebar()" aria-label="Menü öffnen">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>

        <!-- User display (shown only when user is available) -->
        <div class="flex flex-col gap-0.5 min-w-0">
          <div class="font-extrabold text-sm whitespace-nowrap overflow-hidden text-ellipsis max-w-[220px] capitalize" *ngIf="user">{{ user.username }}</div>
        </div>

        <!-- Backend connection status indicator -->
        <div class="text-[12px] opacity-60">
          <app-connection-status></app-connection-status>
        </div>
      </div>

      <!-- Right section: topbar actions -->
      <div class="flex gap-4 items-center">
        <!-- Profile action (visible only when logged in) -->
        <button *ngIf="user" title="Profile" class="border border-slate-200 bg-white rounded-xl p-2 cursor-pointer hover:shadow-sm" aria-label="Profil">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </button>

        <!-- Settings action (visible only when logged in) -->
        <button *ngIf="user" title="Settings" class="border border-slate-200 bg-white rounded-xl p-2 cursor-pointer hover:shadow-sm" aria-label="Einstellung">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </button>

        <!-- Logout action -->
        <button (click)="logout()" class="border border-transparent rounded-xl px-3.5 py-2.5 font-semibold cursor-pointer inline-flex items-center gap-2.5 transition-all active:translate-y-[1px] bg-red-500 text-white" aria-label="Logout">
          <span>Logout</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </button>
      </div>

    </div>
  </header>

  <!-- ===================== -->
  <!-- Main layout: sidebar + content -->
  <!-- ===================== -->
  <div class="flex flex-1 min-h-[calc(100vh-64px)]">

    <!-- Sidebar navigation (responsive: fixed overlay on mobile, static on desktop) -->
    <aside class="w-[260px] bg-slate-900 text-white border-r border-white/10 p-4 flex flex-col gap-3.5 fixed top-16 left-0 bottom-0 z-30 transition-transform duration-250 ease-in-out md:translate-x-0"
           [class.-translate-x-full]="!sidebarOpen"
           [class.translate-x-0]="sidebarOpen">

      <!-- Mobile-only sidebar header with close button -->
      <div class="flex items-center justify-between gap-3 md:hidden">
        <h2 class="text-lg font-bold">Navigation</h2>
        <button class="border border-white/20 bg-transparent text-white rounded-xl px-2.5 py-1.5 cursor-pointer" type="button" (click)="toggleSidebar()">X</button>
      </div>

      <!-- Navigation links -->
      <nav class="flex flex-col gap-1.5">
        <!-- Welcome / home link -->
        <a routerLink="/welcome"
           routerLinkActive="bg-blue-600/25 border border-blue-600/35"
           class="block px-3 py-2.5 rounded-xl no-underline text-white/90 font-bold hover:bg-white/10 transition-all active:translate-y-[1px]">Welcome</a>

        <!-- User dashboard link (visible only for users with USER role) -->
        <a *ngIf="isUser()"
           routerLink="/userdashboard"
           routerLinkActive="bg-blue-600/25 border border-blue-600/35"
           class="block px-3 py-2.5 rounded-xl no-underline text-white/90 font-bold hover:bg-white/10 transition-all active:translate-y-[1px]">User Dashboard</a>

        <!-- Courses link -->
        <a routerLink="/courses"
           routerLinkActive="bg-blue-600/25 border border-blue-600/35"
           class="block px-3 py-2.5 rounded-xl no-underline text-white/90 font-bold hover:bg-white/10 transition-all active:translate-y-[1px]">Kurse</a>

        <!-- Admin dashboard link (visible only for users with ADMIN role) -->
        <a *ngIf="isAdmin()"
           routerLink="/admin"
           routerLinkActive="bg-blue-600/25 border border-blue-600/35"
           class="block px-3 py-2.5 rounded-xl no-underline text-white/90 font-bold hover:bg-white/10 transition-all active:translate-y-[1px]">Admin</a>
      </nav>
    </aside>

    <!-- Mobile overlay behind sidebar (click closes sidebar) -->
    <div class="fixed inset-0 bg-slate-900/45 z-35 md:hidden" *ngIf="sidebarOpen" (click)="toggleSidebar()"></div>

    <!-- Main routed content -->
    <main class="absolute top-16 left-0 md:left-[260px] right-0 bottom-0 overflow-y-auto flex-1 p-6">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
