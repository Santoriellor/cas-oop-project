 <div class="bg-white shadow rounded-xl p-6">
    <h2 class="text-xl font-semibold mb-2">Welcome to the User Dashboard, {{username}}!</h2>
    <p class="text-slate-600 mb-4">Here you can see your courses and certifications.</p>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="border border-slate-200 rounded-xl p-4">
        <h3 class="font-bold mb-2">My Courses</h3>
        <ul *ngIf="enrollments.length > 0; else noCourses">
          <li *ngFor="let e of enrollments" class="mb-2 p-2 border-b border-slate-100 last:border-0">
            <div class="font-medium">{{e.course.name}}</div>
            <div class="text-sm text-slate-500">Status: {{e.status}} | Date: {{e.course.date}}</div>
          </li>
        </ul>
        <ng-template #noCourses>
          <p class="text-sm text-slate-500 italic">No courses enrolled yet.</p>
        </ng-template>
      </div>
      <div class="border border-slate-200 rounded-xl p-4">
        <h3 class="font-bold mb-2">My Certifications</h3>
        <ul *ngIf="certificates.length > 0; else noCerts">
          <li *ngFor="let c of certificates" class="mb-2 p-2 border-b border-slate-100 last:border-0 flex justify-between items-center">
            <div>
              <div class="font-medium">{{c.course.name}}</div>
            </div>
            <button (click)="downloadCert(c.id!)" class="text-blue-600 hover:underline text-sm font-semibold cursor-pointer">
              Download
            </button>
          </li>
        </ul>
        <ng-template #noCerts>
          <p class="text-sm text-slate-500 italic">No certifications earned yet.</p>
        </ng-template>
      </div>
    </div>
  </div>
